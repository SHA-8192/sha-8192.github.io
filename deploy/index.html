<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Deploy</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #2563eb;
      --border: #dbe2ea;
      --success: #16a34a;
      --error: #dc2626;
      --warn: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h1 { font-size: 1.6rem; margin-bottom: 4px; }

    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
      margin-bottom: 14px;
    }

    input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    #status.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; display: block; }
    #status.error   { background: #fef2f2; color: var(--error);   border: 1px solid #fecaca; display: block; }
    #status.info    { background: #eff6ff; color: var(--accent);  border: 1px solid #bfdbfe; display: block; }

    .run-link { font-size: 0.85rem; margin-top: 8px; }
    .run-link a { color: var(--accent); }

    .back { display: inline-block; margin-top: 24px; font-size: 0.9rem; color: var(--accent); text-decoration: none; }
    .back:hover { text-decoration: underline; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>
  <main class="container">
    <h1>🍓 Pi Deploy</h1>
    <p class="subtitle">Trigger an update on your Raspberry Pi via GitHub Actions.</p>

    <label for="token">GitHub Personal Access Token</label>
    <input type="password" id="token" placeholder="ghp_…" autocomplete="current-password" />

    <div class="remember-row">
      <input type="checkbox" id="remember" />
      <label for="remember" style="margin-bottom:0;font-weight:400;">Remember token in this browser</label>
    </div>

    <hr class="divider" />

    <label for="ref">Branch / tag to deploy (optional)</label>
    <input type="text" id="ref" placeholder="main" value="main" />

    <button id="deployBtn" onclick="triggerDeploy()">🚀 Deploy to Pi</button>

    <div id="status"></div>

    <a class="back" href="/">← Back to home</a>
  </main>

  <script>
    const OWNER = 'SHA-8192';
    const REPO  = 'sha-8192.github.io';
    const WORKFLOW = 'deploy-pi.yml';

    const tokenInput    = document.getElementById('token');
    const rememberBox   = document.getElementById('remember');
    const refInput      = document.getElementById('ref');
    const deployBtn     = document.getElementById('deployBtn');
    const statusEl      = document.getElementById('status');

    // Restore saved token
    const saved = localStorage.getItem('pi_deploy_token');
    if (saved) { tokenInput.value = saved; rememberBox.checked = true; }

    async function triggerDeploy() {
      const token = tokenInput.value.trim();
      const ref   = refInput.value.trim() || 'main';

      if (!token) {
        showStatus('error', 'Please enter your GitHub Personal Access Token.');
        return;
      }

      if (rememberBox.checked) {
        localStorage.setItem('pi_deploy_token', token);
      } else {
        localStorage.removeItem('pi_deploy_token');
      }

      deployBtn.disabled = true;
      showStatus('info', 'Dispatching workflow…');

      try {
        const res = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
          {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ ref }),
          }
        );

        if (res.status === 204) {
          showStatus('success',
            '✅ Deployment triggered! ' +
            `<span class="run-link">` +
            `<a href="https://github.com/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}" target="_blank" rel="noopener">` +
            `View workflow runs →</a></span>`
          );
        } else {
          const body = await res.json().catch(() => ({}));
          showStatus('error', `❌ GitHub API error ${res.status}: ${body.message || res.statusText}`);
        }
      } catch (err) {
        showStatus('error', `❌ Network error: ${err.message}`);
      } finally {
        deployBtn.disabled = false;
      }
    }

    function showStatus(type, html) {
      statusEl.className = type;
      statusEl.innerHTML = html;
    }
  </script>
</body>
</html>
