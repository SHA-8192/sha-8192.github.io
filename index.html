<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive generative background." />
  <title>Interactive Field</title>
  <style>
    :root {
      color-scheme: dark;
      background: #071014;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071014;
    }

    body { cursor: crosshair; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .name-display {
      position: fixed;
      top: 28px;
      left: 50%;
      z-index: 2;
      margin: 0;
      color: hsl(var(--hue, 171) 90% 82%);
      font: 800 clamp(2rem, 8vw, 4rem)/0.9 sans-serif;
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 0 24px hsl(var(--hue, 171) 85% 62% / 0.55);
      user-select: none;
      pointer-events: none;
      transform: translateX(-50%) rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
      transition: transform 220ms ease, color 220ms ease, text-shadow 220ms ease;
    }

    .name-display.is-pulsing {
      --scale: 1.08;
      color: hsl(var(--hue, 171) 95% 90%);
      text-shadow: 0 0 42px hsl(var(--hue, 171) 80% 55% / 0.9);
    }

    #light-toggle {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 3;
      padding: 10px 16px;
      background: transparent;
      color: #90efd3;
      border: 1px solid #90efd3;
      border-radius: 999px;
      cursor: pointer;
    }

    body.light-mode {
      cursor: default;
      color-scheme: light;
      background: #b9d8d0;
    }

    body.light-mode #light-toggle {
      color: #164c4b;
      border-color: #164c4b;
    }

    body.light-mode .name-display {
      color: #164c4b;
      text-shadow: 0 0 18px rgba(22, 76, 75, 0.25);
    }

    .light-box {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 3;
      padding: 18px;
      min-width: 160px;
      color: #90efd3;
      background: rgba(7, 16, 20, 0.72);
      border: 1px solid rgba(144, 239, 211, 0.45);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .light-bulb {
      width: 42px;
      height: 42px;
      margin-bottom:12px;
      border-radius: 50%;
      background: #344348;
      box-shadow: none;
      transition: background 220ms ease, box-shadow 220ms ease;
    }

    .light-bulb.is-on {
      background: #ffe28a;
      box-shadow: 0 0 18px #ffe28a,
                  0 0 48px rgba(255, 226, 138, 0.75);
    }

    .light-button {
      padding: 8px 12px;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 6px;
      cursor: pointer;
    }

    .rgb-box {
      top: 180px;
    }

    #rgb-light-color {
      display: block;
      width: 48px;
      height: 32px;
      margin-bottom: 12px;
      padding: 2px;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-bar {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }

    .tab-button {
      padding: 8px 12px;
      color: #90efd3;
      background: rgba(7, 16, 20, 0.72);
      border: 1px solid #90efd3;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-buton.is-active {
      color: #071014;
      background: #90efd3;
    }

    .game-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 4;
      width: min(90vw, 360px);
      padding: 24px;
      color: #90efd3;
      background: rgba(7, 16, 20, 0.86);
      border: 1px solid rgba(144, 239, 211, 0.45);
      border-radius: 12px;
      transform: translate(-50%, -50%);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .game-cell {
      aspect-ratio: 1;
      color: #90efd3;
      font-size: 2.5rem;
      background: rgba(144, 239, 211, 0.08);
      border: 1px solid rgba(144, 239, 211, 0.45);
      border-radius: 6px;
      cursor: pointer;
    }

    .game-cell:disabled {
      cursor: default;
      opacity: 0.7;
    }

    #game-reset {
      padding: 8px 12px;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 6px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <section class="light-box rgb-box" aria-label="RGB light control">
    <div class="light-bulb" id="rgb-light-bulb"></div>
    
    <input
      id="rgb-light-color"
      type="color"
      value="#ff3b81"
      aria-label="RGB light color"
    />

    <button class="light-button" id="rgb-light-toggle" type="button" aria-pressed="false">
      Turn on
    </button>

  </section>

  <section class="light-box" aria-label="Light control">
    <div class="light-bulb" id="light-bulb"></div>
    <button class="light-button" id="device-light-toggle" type="button" aria-pressed="false">
      Turn on
    </button>
  </section>

  <button id="light-toggle" type="button" aria-pressed="false">
    Light
  </button>

  <nav class="tab-bar" aria-label="Views">
    <button class="tab-button is-active" id="field-tab" type="button">
      Field
    </button>
    <button class="tab-button is-active" id="game-tab" type="button">
      Tic Tac Toe
    </button>
  </nav>

  <section class="game-panel" id="game-panel" hidden>
    <h2>Tic-Tac-Toe</h2>
    <p id="game-status">Your turn. You are O.</p>

    <div class="game-board" id="game-board">
      <button class="game-cell" type="button" data-index="0"></button>
      <button class="game-cell" type="button" data-index="1"></button>
      <button class="game-cell" type="button" data-index="2"></button>
      <button class="game-cell" type="button" data-index="3"></button>
      <button class="game-cell" type="button" data-index="4"></button>
      <button class="game-cell" type="button" data-index="5"></button>
      <button class="game-cell" type="button" data-index="6"></button>
      <button class="game-cell" type="button" data-index="7"></button>
      <button class="game-cell" type="button" data-index="8"></button>
    </div>

    <button id="game-reset" type="button">New game</button>
  </section>

  <canvas id="field" aria-label="Interactive animated background"></canvas>
  <div class="name-display" id="name-display" aria-label="Sanjith">SANJITH</div>
  <script>
        const fieldTab = document.querySelector("#field-tab");
    const gameTab = document.querySelector("#game-tab");
    const gamePanel = document.querySelector("#game-panel");
    const gameStatus = document.querySelector("#game-status");
    const gameCells = [...document.querySelectorAll(".game-cell")];
    const gameReset = document.querySelector("#game-reset");

    let gameBoard = Array(9).fill("");
    let gameOver = false;

    const winningLines = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function getWinner(board) {
      for (const [first, second, third] of winningLines) {
        if (
          board[first] &&
          board[first] === board[second] &&
          board[first] === board[third]
        ) {
          return board[first];
        }
      }

      return board.every(Boolean) ? "draw" : null;
    }

    function renderGame() {
      gameCells.forEach((cell, index) => {
        cell.textContent = gameBoard[index];
        cell.disabled = Boolean(gameBoard[index]) || gameOver;
      });
    }

    function finishGame(result) {
      gameOver = true;

      if (result === "draw") {
        gameStatus.textContent = "Draw.";
      } else {
        gameStatus.textContent = result === "O"
          ? "You win!"
          : "The bot wins.";
      }

      renderGame();
    }

    function getBotMove() {
      const emptyCells = gameBoard
        .map((value, index) => value ? null : index)
        .filter((index) => index !== null);

      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function botTurn() {
      const move = getBotMove();

      if (move === undefined) return;

      gameBoard[move] = "X";
      const result = getWinner(gameBoard);

      if (result) {
        finishGame(result);
      } else {
        gameStatus.textContent = "Your turn. You are O.";
        renderGame();
      }
    }

    function playerTurn(event) {
      const index = Number(event.currentTarget.dataset.index);

      if (gameBoard[index] || gameOver) return;

      gameBoard[index] = "O";

      const result = getWinner(gameBoard);

      if (result) {
        finishGame(result);
        return;
      }

      gameStatus.textContent = "Bot is thinking...";
      renderGame();
      window.setTimeout(botTurn, 350);
    }

    function resetGame() {
      gameBoard = Array(9).fill("");
      gameOver = false;
      gameStatus.textContent = "Your turn. You are O.";
      renderGame();
    }

    gameCells.forEach((cell) => {
      cell.addEventListener("click", playerTurn);
    });

    gameReset.addEventListener("click", resetGame);

    gameTab.addEventListener("click", () => {
      gamePanel.hidden = false;
      fieldTab.classList.remove("is-active");
      gameTab.classList.add("is-active");
    });

    fieldTab.addEventListener("click", () => {
      gamePanel.hidden = true;
      gameTab.classList.remove("is-active");
      fieldTab.classList.add("is-active");
    });

    renderGame();
    
    const deviceLightToggle = document.querySelector("#device-light-toggle");
    const lightBulb = document.querySelector("#light-bulb");
    let deviceLightOn = false;

    deviceLightToggle.addEventListener("click", () => {
      deviceLightOn = !deviceLightOn;

      lightBulb.classList.toggle("is-on", deviceLightOn);
      deviceLightToggle.textContent = deviceLightOn ? "Turn off" : "Turn on";
      deviceLightToggle.setAttribute("aria-pressed", String(deviceLightOn));
    });

    const rgbLightToggle = document.querySelector("#rgb-light-toggle");
    const rgbLightBulb = document.querySelector("#rgb-light-bulb");
    const rgbLightColor = document.querySelector("#rgb-light-color");

    let rgbLightOn = false;

    function updateRgbLight() {
      if (!rgbLightOn) {
      rgbLightBulb.style.background = "#344348";
      rgbLightBulb.style.boxShadow = "none";
      return;
    }

    const color = rgbLightColor.value;

    rgbLightBulb.style.background = color;
    rgbLightBulb.style.boxShadow = `
      0 0 18px ${color},
      0 0 48px ${color}
    `;
  }

rgbLightToggle.addEventListener("click", () => {
  rgbLightOn = !rgbLightOn;
  rgbLightToggle.textContent = rgbLightOn ? "Turn off" : "Turn on";
  rgbLightToggle.setAttribute("aria-pressed", String(rgbLightOn));
  updateRgbLight();
});

rgbLightColor.addEventListener("input", updateRgbLight);

    const lightToggle = document.querySelector("#light-toggle")
    let lightMode = false

    lightToggle.addEventListener("click", () => {
      lightMode = !lightMode;
      document.body.classList.toggle("light-mode", lightMode);
      lightToggle.textContent = lightMode ? "Dark" : "Light";
      lightToggle.setAttribute("aria-pressed", String(lightMode));
    });
    const canvas = document.querySelector("#field");
    const context = canvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, active: false };
    const nameDisplay = document.querySelector("#name-display");
    const particles = [];
    const ripples = [];
    let width = 0;
    let height = 0;
    let density = 0;
    let time = 0;

    function animateName() {
      nameDisplay.style.setProperty("--hue", Math.floor(Math.random() * 360));
      nameDisplay.style.setProperty("--tilt", `${Math.round(Math.random() * 12 - 6)}deg`);
      nameDisplay.classList.remove("is-pulsing");
      void nameDisplay.offsetWidth;
      nameDisplay.classList.add("is-pulsing");
      window.setTimeout(() => nameDisplay.classList.remove("is-pulsing"), 320);
    }

    function resize() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      density = Math.min(110, Math.max(40, Math.floor(width * height / 18000)));
      particles.length = 0;
      for (let index = 0; index < density; index += 1) createParticle(true);
    }

    function createParticle(randomPosition = false) {
      particles.push({
        x: randomPosition ? Math.random() * width : width + 20,
        y: Math.random() * height,
        radius: Math.random() * 1.8 + 0.35,
        speed: Math.random() * 0.22 + 0.04,
        drift: Math.random() * 0.7 + 0.15,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() > 0.52 ? 171 : 34
      });
    }

    function updatePointer(event) {
      pointer.targetX = event.clientX / width;
      pointer.targetY = event.clientY / height;
      pointer.active = true;
    }

    function addRipple(event) {
      ripples.push({
        x: event.clientX,
        y: event.clientY,
        radius: 0,
        opacity: 0.6
      });
      animateName();
    }

    function drawBackground() {
      context.clearRect(0, 0, width, height);
      context.fillStyle = lightMode ? "#b9d8d0" : "#071014";
      context.fillRect(0, 0, width, height);

      const glowX = pointer.x * width;
      const glowY = pointer.y * height;

      const gradient = context.createRadialGradient(
        glowX,
        glowY,
        0,
        glowX,
        glowY,
        Math.max(width, height) * 0.8
      );

      if (lightMode) {
        gradient.addColorStop(0, "rgba(20, 110, 100, 0.08)");
        gradient.addColorStop(0.35, "transparent");
        gradient.addColorStop(1, "rgba(220, 130, 60, 0.08)");
      } else {
        gradient.addColorStop(0, `hsla(${170 + Math.sin(time * 0.0002) * 20}, 70%, 45%, 0.13)`);
        gradient.addColorStop(0.35, "transparent");
        gradient.addColorStop(1, `hsla(${28 + Math.sin(time * 0.00016) * 18}, 85%, 52%, 0.1)`);
      }

      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      const wash = context.createLinearGradient(0, 0, width, height);
      if (lightMode) {
        wash.addColorStop(0, "rgba(20, 110, 100, 0.08)");
        wash.addColorStop(0.5, "transparent");
        wash.addColorStop(1, "rgba(220, 130, 60, 0.08)");
      } else {
        wash.addColorStop(0, `hsla(${170 + Math.sin(time * 0.0002) * 20}, 70%, 45%, 0.13)`);
        wash.addColorStop(0.5, "transparent");
        wash.addColorStop(1, `hsla(${28 + Math.sin(time * 0.00016) * 18}, 85%, 52%, 0.1)`);
      }
      context.fillStyle = wash;
      context.fillRect(0, 0, width, height);
    }

    function drawParticles() {
      context.globalCompositeOperation = "source-over";
      particles.forEach((particle, index) => {
        if (!reducedMotion.matches) {
          particle.x -= particle.speed;
          particle.y += Math.sin(time * 0.001 * particle.drift + particle.phase) * 0.18;
          if (particle.x < -12) {
            particle.x = width + 12;
            particle.y = Math.random() * height;
          }
        }

        const distanceX = particle.x - pointer.x * width;
        const distanceY = particle.y - pointer.y * height;
        const distance = Math.hypot(distanceX, distanceY);
        const influence = pointer.active ? Math.max(0, 1 - distance / 360) : 0;
        const size = particle.radius + influence * 0.8;
        const alpha = lightMode
          ? 0.06 + influence * 0.12
          : 0.08 + influence * 0.18;
        const lightness = lightMode ? 42 : 72;
        context.beginPath();
        context.arc(particle.x - distanceX * influence * 0.08, particle.y - distanceY * influence * 0.08, size, 0, Math.PI * 2);
        context.fillStyle = `hsla(${particle.hue}, 78%, ${lightness}%, ${alpha})`;
        context.fill();
      });
      context.globalCompositeOperation = "source-over";
    }

    function drawRipples() {
      ripples.forEach((ripple) => {
        ripple.radius += 5;
        ripple.opacity *= 0.965;
        context.beginPath();
        context.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
        context.strokeStyle = lightMode
          ? `rgba(22, 100, 95, ${ripple.opacity})`
          : `rgba(144, 239, 211, ${ripple.opacity})`;
        context.lineWidth = 1.5;
        context.stroke();
      });
      while (ripples.length && ripples[0].opacity < 0.02) ripples.shift();
    }

    function render(timestamp = 0) {
      time = timestamp;
      pointer.x += (pointer.targetX - pointer.x) * 0.045;
      pointer.y += (pointer.targetY - pointer.y) * 0.045;
      drawBackground();
      drawParticles();
      if (!reducedMotion.matches) drawRipples();
      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", updatePointer);
    window.addEventListener("pointerdown", addRipple);
    window.addEventListener("pointerleave", () => { pointer.active = false; });
    reducedMotion.addEventListener?.("change", resize);
    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
