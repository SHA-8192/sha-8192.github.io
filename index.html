<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive generative background." />
  <title>Interactive Field</title>
  <style>
    :root {
      color-scheme: dark;
      background: #071014;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071014;
    }

    body { cursor: crosshair; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .name-display {
      position: fixed;
      top: 28px;
      left: 50%;
      z-index: 2;
      margin: 0;
      color: hsl(var(--hue, 171) 90% 82%);
      font: 800 clamp(2rem, 8vw, 4rem)/0.9 sans-serif;
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 0 24px hsl(var(--hue, 171) 85% 62% / 0.55);
      user-select: none;
      pointer-events: none;
      transform: translateX(-50%) rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
      transition: transform 220ms ease, color 220ms ease, text-shadow 220ms ease;
    }

    .name-display.is-pulsing {
      --scale: 1.08;
      color: hsl(var(--hue, 171) 95% 90%);
      text-shadow: 0 0 42px hsl(var(--hue, 171) 80% 55% / 0.9);
    }
  </style>
</head>
<body>
  <canvas id="field" aria-label="Interactive animated background"></canvas>
  <div class="name-display" id="name-display" aria-label="Sanjith">SANJITH</div>
  <script>
    const canvas = document.querySelector("#field");
    const context = canvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, active: false };
    const nameDisplay = document.querySelector("#name-display");
    const particles = [];
    const ripples = [];
    let width = 0;
    let height = 0;
    let density = 0;
    let time = 0;

    function animateName() {
      nameDisplay.style.setProperty("--hue", Math.floor(Math.random() * 360));
      nameDisplay.style.setProperty("--tilt", `${Math.round(Math.random() * 12 - 6)}deg`);
      nameDisplay.classList.remove("is-pulsing");
      void nameDisplay.offsetWidth;
      nameDisplay.classList.add("is-pulsing");
      window.setTimeout(() => nameDisplay.classList.remove("is-pulsing"), 320);
    }

    function resize() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      density = Math.min(190, Math.max(70, Math.floor(width * height / 10500)));
      particles.length = 0;
      for (let index = 0; index < density; index += 1) createParticle(true);
    }

    function createParticle(randomPosition = false) {
      particles.push({
        x: randomPosition ? Math.random() * width : width + 20,
        y: Math.random() * height,
        radius: Math.random() * 1.8 + 0.35,
        speed: Math.random() * 0.22 + 0.04,
        drift: Math.random() * 0.7 + 0.15,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() > 0.52 ? 171 : 34
      });
    }

    function updatePointer(event) {
      pointer.targetX = event.clientX / width;
      pointer.targetY = event.clientY / height;
      pointer.active = true;
    }

    function addRipple(event) {
      ripples.push({
        x: event.clientX,
        y: event.clientY,
        radius: 0,
        opacity: 0.6
      });
      animateName();
    }

    function drawBackground() {
      const glowX = pointer.x * width;
      const glowY = pointer.y * height;
      const gradient = context.createRadialGradient(glowX, glowY, 0, glowX, glowY, Math.max(width, height) * 0.8);
      gradient.addColorStop(0, "#163b3e");
      gradient.addColorStop(0.35, "#0d2027");
      gradient.addColorStop(1, "#050b10");
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      const wash = context.createLinearGradient(0, 0, width, height);
      wash.addColorStop(0, `hsla(${170 + Math.sin(time * 0.0002) * 20}, 70%, 45%, 0.13)`);
      wash.addColorStop(0.5, "transparent");
      wash.addColorStop(1, `hsla(${28 + Math.sin(time * 0.00016) * 18}, 85%, 52%, 0.1)`);
      context.fillStyle = wash;
      context.fillRect(0, 0, width, height);
    }

    function drawParticles() {
      context.globalCompositeOperation = "lighter";
      particles.forEach((particle, index) => {
        if (!reducedMotion.matches) {
          particle.x -= particle.speed;
          particle.y += Math.sin(time * 0.001 * particle.drift + particle.phase) * 0.18;
          if (particle.x < -12) {
            particle.x = width + 12;
            particle.y = Math.random() * height;
          }
        }

        const distanceX = particle.x - pointer.x * width;
        const distanceY = particle.y - pointer.y * height;
        const distance = Math.hypot(distanceX, distanceY);
        const influence = pointer.active ? Math.max(0, 1 - distance / 260) : 0;
        const size = particle.radius + influence * 2.5;
        const alpha = 0.18 + influence * 0.55;
        context.beginPath();
        context.arc(particle.x - distanceX * influence * 0.08, particle.y - distanceY * influence * 0.08, size, 0, Math.PI * 2);
        context.fillStyle = `hsla(${particle.hue + Math.sin(index + time * 0.0004) * 10}, 88%, 72%, ${alpha})`;
        context.fill();
      });
      context.globalCompositeOperation = "source-over";
    }

    function drawRipples() {
      ripples.forEach((ripple) => {
        ripple.radius += 5;
        ripple.opacity *= 0.965;
        context.beginPath();
        context.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
        context.strokeStyle = `rgba(144, 239, 211, ${ripple.opacity})`;
        context.lineWidth = 1.5;
        context.stroke();
      });
      while (ripples.length && ripples[0].opacity < 0.02) ripples.shift();
    }

    function render(timestamp = 0) {
      time = timestamp;
      pointer.x += (pointer.targetX - pointer.x) * 0.045;
      pointer.y += (pointer.targetY - pointer.y) * 0.045;
      drawBackground();
      drawParticles();
      if (!reducedMotion.matches) drawRipples();
      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", updatePointer);
    window.addEventListener("pointerdown", addRipple);
    window.addEventListener("pointerleave", () => { pointer.active = false; });
    reducedMotion.addEventListener?.("change", resize);
    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
