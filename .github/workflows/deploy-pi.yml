name: Deploy to Pi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    name: Update Raspberry Pi
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Pi and run update script
        uses: appleboy/ssh-action@v1.2.1
        with:
          host:     ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key:      ${{ secrets.PI_SSH_KEY }}
          port:     ${{ secrets.PI_PORT || 22 }}
          script: |
            set -e
            echo "=== Pi update triggered by GitHub Actions ==="
            cd ${{ secrets.PI_PROJECT_PATH }}
            git fetch origin
            git checkout ${{ github.event.inputs.ref || 'main' }}
            git pull origin ${{ github.event.inputs.ref || 'main' }}
            # Add any extra commands below, e.g.:
            # pip install -r requirements.txt
            # sudo systemctl restart myservice
            echo "=== Update complete ==="
